name: Somewhere historical v0.2 verification

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: somewhere-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Ubuntu web app
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    env:
      CI: true
      VITE_BUILD_SHA: ${{ github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Set up Node for frozen prototype regression
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install frozen dependencies
        run: bun ci

      - name: Audit dependency advisories
        run: bun audit

      - name: Install Playwright browsers
        run: bunx --no-install playwright install --with-deps chromium webkit

      - name: Verify app and frozen prototype
        run: bun run verify

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: somewhere-failure-evidence-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            app/test-results
            app/playwright-report
            output
