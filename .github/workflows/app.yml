name: Somewhere app

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: somewhere-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Ubuntu web app
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    env:
      CI: true
      VITE_BUILD_SHA: ${{ github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Set up Node for frozen prototype regression
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install frozen dependencies
        run: bun ci

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium webkit

      - name: Verify app and frozen prototype
        run: bun run verify

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: somewhere-failure-evidence-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            app/test-results
            app/playwright-report
            output

      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6

      - name: Upload verified Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: app/dist

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified artifact
        id: deployment
        uses: actions/deploy-pages@v5
