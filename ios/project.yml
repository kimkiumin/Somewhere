name: Somewhere
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Somewhere:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Somewhere
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: example.somewhere.field
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGN_STYLE: Automatic
  SomewhereTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - SomewhereTests
    dependencies:
      - target: Somewhere
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: example.somewhere.field.tests
        GENERATE_INFOPLIST_FILE: YES
